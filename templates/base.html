
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}ResumeGen AI{% endblock %}</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=12">

</head>

<body>

    <!-- ================= NAVIGATION BAR ================= -->

    <nav class="navbar">

        <!-- BRAND LOGO -->
        <a href="{% url 'home' %}" class="brand">

            <span class="brand-icon">R</span>

            <span>
                ResumeGen<span class="brand-ai">.AI</span>
            </span>

        </a>


        <!-- NAVIGATION LINKS -->
        <div class="nav-links">

            <a href="{% url 'home' %}#home">
                Home
            </a>

            <a href="{% url 'home' %}#features">
                Features
            </a>

            <a href="{% url 'home' %}#how-it-works">
                How It Works
            </a>

            <a href="{% url 'home' %}#about">
                About
            </a>

        </div>


        <!-- LOGIN AND REGISTRATION BUTTONS -->
        <div class="nav-actions">

            <!-- LOGIN -->
            <a href="{% url 'accounts:login' %}" class="login-link">
                Log In
            </a>

            <!-- REGISTER -->
            <a href="{% url 'accounts:register' %}" class="nav-cta">
                Get Started ↗
            </a>

        </div>

    </nav>


    <!-- ================= MAIN CONTENT ================= -->

    <main>

        {% block content %}
        {% endblock %}

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="footer-brand">

            <span class="brand-icon">R</span>

            ResumeGen.AI

        </div>

        <p>
            Designed for your next big opportunity.
        </p>

        <p class="copyright">
            © 2026 ResumeGen AI. All rights reserved.
        </p>

    </footer>


</body>
</html>
